name: pengeluaran-app

services:
  # ---------------- DATABASE ----------------
  db:
    image: mongo:7
    container_name: pengeluaran-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER wajib diisi di .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD wajib diisi di .env}
    volumes:
      - mongo_data:/data/db
    networks:
      - backend            # hanya jaringan internal, TIDAK ada "ports:"
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet -u "$${MONGO_INITDB_ROOT_USERNAME}" -p "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------- APLIKASI ----------------
  app:
    build: .
    image: pengeluaran-app:1.0
    container_name: pengeluaran-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_OWNER: ${APP_OWNER:-Praktikan}
      PORT: "3000"
      MONGO_HOST: db       # nama service, bukan IP
      MONGO_PORT: "27017"
      MONGO_DB: ${MONGO_DB:?MONGO_DB wajib diisi di .env}
      MONGO_USER: ${MONGO_USER:?MONGO_USER wajib diisi di .env}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD wajib diisi di .env}
    ports:
      - "80:3000"          # port 80 VM -> port 3000 container
    networks:
      - frontend           # untuk akses dari luar
      - backend            # untuk berbicara ke database
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  frontend:
  backend:
    internal: true         # tidak ada akses dari/ke luar Docker

volumes:
  mongo_data:
